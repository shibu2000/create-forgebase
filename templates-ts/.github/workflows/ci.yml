name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Kept in step with local development via .nvmrc, so CI cannot pass
          # on a Node version nobody actually runs.
          node-version-file: .nvmrc
          cache: npm

      # `ci` rather than `install`: it installs exactly the lockfile and fails
      # if package.json and the lockfile have drifted apart.
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      # `--if-present`: the JavaScript variant of this scaffold has no
      # typecheck script, and CI should not fail for its absence.
      - run: npm run typecheck --if-present

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Testcontainers starts a real PostgreSQL container, so this needs a
    # Docker daemon. GitHub's hosted Ubuntu runners have one preinstalled,
    # which is why there is no `services:` block here — the test suite manages
    # its own database and tears it down afterwards.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Pulling the Postgres image is the slowest part of a cold run; doing it
      # here keeps the failure legible if the registry is unreachable, rather
      # than surfacing as a test timeout.
      - name: Pre-pull the database image
        run: docker pull postgres:17-alpine

      - run: npm test
        env:
          # The suite provisions its own database; these are the only values
          # it cannot invent for itself.
          JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters
